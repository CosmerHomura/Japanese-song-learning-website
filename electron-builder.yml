appId: com.cosmerhomura.uta
productName: UTA
asar: true

directories:
  output: out

files:
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/aiRequestPolicy.cjs
  - desktop/updateManager.cjs
  - desktop/assets/**
  - package.json

extraResources:
  - from: desktop/backend-dist/uta-backend
    to: uta-backend

win:
  icon: desktop/assets/uta.ico
  target:
    - nsis
  artifactName: UTA-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true

publish:
  provider: github
  owner: CosmerHomura
  repo: Japanese-song-learning-website
